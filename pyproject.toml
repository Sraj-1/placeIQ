[project]
name = "placeiq"
version = "0.1.0"
description = "Placement readiness prediction and skill-gap analysis with explainable ML"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["placeiq*"]

[tool.setuptools.package-data]
placeiq = ["extraction/taxonomy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
